# 9jaBeacon Cloudflare Worker — HARD STOPPED 2026-10-25
# Cron removed. Do NOT re-add until D1 quota + dedup are stable.
# After pushing: from workers/ run:
#   npx wrangler deploy
# Or in CF dashboard: Workers → 9jabeacon-ingest-worker → Triggers → delete cron

name = "9jabeacon-ingest-worker"
main = "./cron-ingest.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "naijablog"
database_id = "5ad4457f-0528-473b-a805-f505aa71eacf"
migrations_dir = "../migrations"

# CRON DISABLED — empty triggers (no */30 schedule)
[triggers]
crons = []

[vars]
ENVIRONMENT = "production"
SITE_NAME = "9jaBeacon"
SITE_URL = "https://www.9jabeacon.name.ng"
INGEST_DISABLED = "true"
