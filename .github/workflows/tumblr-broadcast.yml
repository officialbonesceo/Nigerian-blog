name: Tumblr Social Syndication

# ==============================================================================
# 9jaBeacon - Autonomous Tumblr Social Syndication
#
# TRIGGER POLICY:
# - Schedule: Thrice daily at 06:15, 12:15, 18:15 UTC (07:15, 13:15, 19:15 WAT)
# - Workflow Dispatch: Manual 1-click broadcast from GitHub Actions UI
# - Push events: Strictly disabled to conserve Actions minutes
# ==============================================================================

on:
  schedule:
    - cron: '15 6,12,18 * * *' # Thrice daily (Morning briefing, Afternoon peak, Evening roundup)
  workflow_dispatch:
    inputs:
      article_slug:
        description: 'Article Slug to broadcast (leave empty to broadcast latest unsyndicated story)'
        required: false
        default: ''
        type: string
      force:
        description: 'Force broadcast even if already posted'
        required: false
        default: false
        type: boolean

jobs:
  tumblr-broadcast:
    name: 📟 Broadcast to Tumblr
    runs-on: ubuntu-latest
    if: github.event_name != 'push'
    permissions:
      contents: read

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🟢 Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: false

      - name: 📦 Install Runtime Packages
        run: npm install --no-audit --no-fund

      - name: 📥 Sync Latest Articles from Upstream (Cloudflare D1)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          ALLOW_SEED_ARTICLES: 'false'
          ALLOW_SEED_DATA: 'false'
        run: npx tsx scripts/sync-cache.ts || true

      - name: 📟 Publish to Tumblr API v2
        env:
          TUMBLR_BLOG_IDENTIFIER: ${{ secrets.TUMBLR_BLOG_IDENTIFIER }}
          TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          TUMBLR_TOKEN: ${{ secrets.TUMBLR_TOKEN }}
          TUMBLR_TOKEN_SECRET: ${{ secrets.TUMBLR_TOKEN_SECRET }}
          TUMBLR_ACCESS_TOKEN: ${{ secrets.TUMBLR_ACCESS_TOKEN }}
          TARGET_SLUG: ${{ github.event.inputs.article_slug }}
          FORCE_BROADCAST: ${{ github.event.inputs.force }}
          SITE_URL: https://www.9jabeacon.name.ng
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: npx tsx scripts/broadcast-tumblr.ts

      - name: 📤 Push Syndication Log to Upstream Datastore
        if: always()
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          ALLOW_SEED_ARTICLES: 'false'
          ALLOW_SEED_DATA: 'false'
        run: npx tsx scripts/sync-upstream.ts || true
