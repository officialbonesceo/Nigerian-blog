name: Restore StickmanStudio

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore StickmanStudio from good commit
        run: |
          set -eux
          git show 6c04d9199a24f0597ba746cd79da940bad1267b3:src/components/StickmanStudio.astro > src/components/StickmanStudio.astro
          wc -c src/components/StickmanStudio.astro

      - name: Apply walk and chair patches
        run: python3 scripts/patch-stickman-walk.py

      - name: Commit and push
        run: |
          set -eux
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/StickmanStudio.astro
          git status
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix(stickman): restore full studio + auto-stand on walk + gait bob"
            git push origin HEAD:main
          fi
