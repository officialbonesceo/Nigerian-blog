name: Daily Desk (strict 1–2/day)

# NEW engine — old content-delivery stays paused.
on:
  workflow_dispatch:
    inputs:
      max_articles:
        description: "Max articles this run (1 or 2)"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
  schedule:
    # 08:00 WAT = 07:00 UTC — one run per day, default max 1
    - cron: '0 7 * * *'

concurrency:
  group: daily-desk-strict
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Strict daily desk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run daily desk (max 1–2)
        env:
          MAX_ARTICLES: ${{ github.event.inputs.max_articles || '1' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node scripts/daily-desk.mjs

      - name: Social syndication (Bluesky + Tumblr, file-based)
        env:
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          BLUESKY_AUTO_POST_ENABLED: ${{ secrets.BLUESKY_AUTO_POST_ENABLED }}
          TUMBLR_BLOG_IDENTIFIER: ${{ secrets.TUMBLR_BLOG_IDENTIFIER }}
          TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          TUMBLR_TOKEN: ${{ secrets.TUMBLR_TOKEN }}
          TUMBLR_TOKEN_SECRET: ${{ secrets.TUMBLR_TOKEN_SECRET }}
          TUMBLR_ACCESS_TOKEN: ${{ secrets.TUMBLR_ACCESS_TOKEN }}
          TUMBLR_AUTO_POST_ENABLED: ${{ secrets.TUMBLR_AUTO_POST_ENABLED }}
        run: node scripts/social-syndicate-file.mjs
        continue-on-error: true

      - name: Commit feed lock + social state (if changed)
        run: |
          git config user.name "9jaBeacon Desk"
          git config user.email "desk@9jabeacon.name.ng"
          git add desk/state public/news-sitemap.xml public/sitemap.xml public/rss.xml 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No feed/lock changes"
          else
            git commit -m "chore(desk): daily lock + feed + social state [skip ci]" || true
            git push || true
          fi
