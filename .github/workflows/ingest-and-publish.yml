name: 9jaBeacon AI News Ingestion

on:
  schedule:
    # Runs once every 3 hours (conserves workflow & API limits)
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  ingest-and-synthesize:
    name: 🤖 9jaBeacon Autonomous News Engine
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Install Dependencies
        run: npm install --no-audit --no-fund

      - name: 🤖 Execute 3-Tier AI Ingestion Pipeline
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE: 'naijablog'
          CLOUDFLARE_AI_MODEL: ${{ secrets.CLOUDFLARE_AI_MODEL || '@cf/meta/llama-3.1-8b-instruct' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL || 'meta-llama/llama-3.3-70b-instruct:free' }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME || 'phwka7ak' }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET || 'voxawell' }}
          NODE_ENV: production
        run: npx tsx scripts/ingest.ts

      - name: 🚀 Commit and Push Updated News Database (Zero Build Trigger)
        run: |
          git config --global user.name "9jaBeacon Bot"
          git config --global user.email "bot@9jabeacon.ng"
          git add 9jabeacon.db
          if git diff --staged --quiet; then
            echo "No new news articles were published this cycle."
          else
            # [skip ci] prevents Cloudflare Pages from rebuilding and wasting monthly build minutes!
            git commit -m "chore(news): autonomous 3-hour AI news sync [skip ci]"
            git push origin main
          fi
