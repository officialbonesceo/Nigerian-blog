name: 9jaBeacon AI News Ingestion

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

concurrency:
  group: 9jabeacon-news-ingestion
  cancel-in-progress: false

jobs:
  ingest-and-publish:
    name: 🤖 9jaBeacon Autonomous News Engine
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: false

      - name: 📦 Install Dependencies
        run: npm install --no-audit --no-fund

      - name: 🔐 Validate required Cloudflare secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN (Workers AI token)'; exit 1; }
          test -n "$CLOUDFLARE_D1_API_TOKEN" || { echo 'Missing CLOUDFLARE_D1_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_D1_DATABASE_ID" || { echo 'Missing CLOUDFLARE_D1_DATABASE_ID'; exit 1; }
          test -n "$CLOUDFLARE_PAGES_API_TOKEN" || { echo 'Missing CLOUDFLARE_PAGES_API_TOKEN (Pages Write token)'; exit 1; }
          echo 'Cloudflare secrets are present.'

      - name: 🧩 Disable local mock seed data for CI
        run: npx tsx scripts/ci-prepare-runtime.ts

      - name: ☁️ Pull current D1 into ephemeral build database
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          NODE_ENV: production
          ALLOW_SEED_ARTICLES: 'false'
          ALLOW_SEED_DATA: 'false'
        run: npx tsx scripts/sync-d1-to-local.ts

      - name: 🤖 Execute AI news ingestion pipeline
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_AI_MODEL: ${{ secrets.CLOUDFLARE_AI_MODEL || '@cf/meta/llama-3.1-8b-instruct' }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_D1_DATABASE: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL || 'meta-llama/llama-3.3-70b-instruct:free' }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME || 'phwka7ak' }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET || 'voxawell' }}
          NODE_ENV: production
          ALLOW_SEED_ARTICLES: 'false'
          ALLOW_SEED_DATA: 'false'
        run: npx tsx scripts/ingest.ts

      - name: ☁️ Write newly ingested data to D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          ALLOW_SEED_ARTICLES: 'false'
          ALLOW_SEED_DATA: 'false'
        run: npx tsx scripts/sync-local-changes-to-d1.ts

      - name: 👥 Normalize transparent editorial desk profiles in D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: npx tsx scripts/normalize-editorial-profiles.ts

      - name: ☁️ Pull final D1 snapshot for static build
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          NODE_ENV: production
          ALLOW_SEED_ARTICLES: 'false'
          ALLOW_SEED_DATA: 'false'
        run: npx tsx scripts/sync-d1-to-local.ts

      - name: 🏗️ Build static Astro site
        env:
          NODE_ENV: production
          ALLOW_SEED_ARTICLES: 'false'
          ALLOW_SEED_DATA: 'false'
        run: npm run build

      - name: 🚀 Deploy static site without a Git commit
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
        run: npx wrangler pages deploy dist --project-name 9jabeacon-news --branch main

      - name: 🧹 Safety check — database must never be tracked
        run: |
          if git ls-files --error-unmatch 9jabeacon.db >/dev/null 2>&1; then
            echo 'ERROR: 9jabeacon.db is still tracked by Git.'
            exit 1
          fi
          echo 'OK: database is not tracked and no database commit/push is performed.'
