name: D1 Quota Guard

# PAUSED 2026-11-01 — no scheduled token use. Manual only if you restore a READ token.
on:
  # schedule:
  #   - cron: '15 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  ROWS_READ_THRESHOLD: '3500000'
  NAIJABLOG_DB_ID: '5ad4457f-0528-473b-a805-f505aa71eacf'

jobs:
  guard:
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v4
      - name: Paused
        run: echo 'd1-guard paused — re-enable job if after restoring a read-only token'
