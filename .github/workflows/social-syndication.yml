name: Social Syndication (file queue)

# File-based only — zero D1 reads/writes
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Daily Desk (strict 1–2/day)"]
    types: [completed]
  # schedule:
  #   - cron: '45 8,14 * * *'

concurrency:
  group: file-syndication
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  syndicate:
    name: Process pending social (no D1)
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run file-based social queue
        env:
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          BLUESKY_AUTO_POST_ENABLED: ${{ secrets.BLUESKY_AUTO_POST_ENABLED }}
          TUMBLR_BLOG_IDENTIFIER: ${{ secrets.TUMBLR_BLOG_IDENTIFIER }}
          TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          TUMBLR_TOKEN: ${{ secrets.TUMBLR_TOKEN }}
          TUMBLR_TOKEN_SECRET: ${{ secrets.TUMBLR_TOKEN_SECRET }}
          TUMBLR_ACCESS_TOKEN: ${{ secrets.TUMBLR_ACCESS_TOKEN }}
          TUMBLR_AUTO_POST_ENABLED: ${{ secrets.TUMBLR_AUTO_POST_ENABLED }}
        run: node scripts/social-syndicate-file.mjs

      - name: Commit history / pending cleanup
        run: |
          git config user.name "9jaBeacon Desk"
          git config user.email "desk@9jabeacon.name.ng"
          git add desk/state/social-pending desk/state/social-history.jsonl 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No social state changes"
          else
            git commit -m "chore(social): queue state [skip ci]" || true
            git push || true
          fi
