<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="600" height="700">
  <defs>
    <!-- Radiant Golden Aura -->
    <radialGradient id="goldAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#eab308" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Golden Stickman Glow -->
    <filter id="stickmanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Metallic Anchor Desk -->
    <linearGradient id="anchorDeskGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="25%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="75%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Emerald Accent Trim -->
    <linearGradient id="emeraldTrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="1"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Studio Cyber Horizon Backdrop -->
  <rect width="600" height="700" rx="32" fill="#030712"/>
  <circle cx="300" cy="220" r="180" fill="url(#goldAura)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6">
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="360" x2="600" y2="360"/>
    <line x1="150" y1="0" x2="150" y2="700"/>
    <line x1="300" y1="0" x2="300" y2="700"/>
    <line x1="450" y1="0" x2="450" y2="700"/>
  </g>

  <!-- ON-AIR Status Badge -->
  <g transform="translate(460, 40)">
    <rect width="100" height="32" rx="8" fill="#1e1b4b" stroke="#ef4444" stroke-width="1.5"/>
    <circle cx="20" cy="16" r="4.5" fill="#ef4444"/>
    <text x="34" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#f87171" letter-spacing="1.5">LIVE</text>
  </g>

  <!-- Brand Channel Tag -->
  <g transform="translate(40, 40)">
    <rect width="150" height="32" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="20" cy="16" r="4.5" fill="#10b981"/>
    <text x="34" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#a7f3d0" letter-spacing="1">9JABEACON TV</text>
  </g>

  <!-- ARTICULATED STICKMAN PRESENTER BODY -->
  <g id="stickman-presenter" filter="url(#stickmanGlow)">
    <!-- Spine / Torso -->
    <line x1="300" y1="260" x2="300" y2="440" stroke="#facc15" stroke-width="12" stroke-linecap="round"/>

    <!-- Left Arm (Pointing Gesturing to News Monitor) -->
    <path d="M 300 300 Q 200 280 140 220" stroke="#facc15" stroke-width="10" fill="none" stroke-linecap="round"/>
    <circle cx="140" cy="220" r="10" fill="#facc15"/>

    <!-- Right Arm (Resting Confidently on News Anchor Desk) -->
    <path d="M 300 300 Q 380 340 440 420" stroke="#facc15" stroke-width="10" fill="none" stroke-linecap="round"/>
    <circle cx="440" cy="420" r="10" fill="#facc15"/>

    <!-- Anchor Crimson Silk Tie -->
    <path d="M 300 265 L 290 340 L 300 365 L 310 340 Z" fill="#ef4444" stroke="#991b1b" stroke-width="2"/>
    <circle cx="300" cy="265" r="7" fill="#dc2626"/>

    <!-- Stickman Head (Golden Luminous Ring) -->
    <circle cx="300" cy="180" r="62" fill="#0b1329" stroke="#facc15" stroke-width="12"/>

    <!-- Expressive Eyes -->
    <ellipse cx="280" cy="172" rx="7" ry="9" fill="#fef08a"/>
    <ellipse cx="320" cy="172" rx="7" ry="9" fill="#fef08a"/>

    <!-- Articulated Eyebrows -->
    <path d="M 270 156 Q 280 150 292 154" stroke="#facc15" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M 308 154 Q 320 150 330 156" stroke="#facc15" stroke-width="4.5" fill="none" stroke-linecap="round"/>

    <!-- Confident News Anchor Smile -->
    <path d="M 284 198 Q 300 216 316 198" stroke="#facc15" stroke-width="6" fill="none" stroke-linecap="round"/>

    <!-- Broadcast Headset -->
    <path d="M 235 175 Q 300 100 365 175" stroke="#94a3b8" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Cyan Earpieces -->
    <rect x="230" y="160" width="12" height="30" rx="6" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
    <rect x="358" y="160" width="12" height="30" rx="6" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
    <!-- Headset Boom Mic -->
    <path d="M 236 185 Q 260 215 285 210" stroke="#94a3b8" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="285" cy="210" r="5" fill="#38bdf8"/>
  </g>

  <!-- News Anchor Metallic Curved Desk -->
  <g id="anchor-desk">
    <!-- Desk Top Edge -->
    <path d="M 60 520 Q 300 460 540 520 L 580 680 L 20 680 Z" fill="url(#anchorDeskGrad)" stroke="#475569" stroke-width="2.5"/>
    <!-- Glowing Emerald Trim -->
    <path d="M 60 520 Q 300 460 540 520" stroke="url(#emeraldTrim)" stroke-width="6" fill="none"/>

    <!-- Newsroom Broadcast Tablet on Desk -->
    <rect x="230" y="500" width="140" height="70" rx="8" fill="#020617" stroke="#38bdf8" stroke-width="2" transform="rotate(-4 300 535)"/>
    <text x="245" y="535" font-family="monospace" font-size="10" font-weight="bold" fill="#38bdf8" transform="rotate(-4 300 535)">9JA BREAKING</text>
    <line x1="245" y1="545" x2="350" y2="545" stroke="#10b981" stroke-width="2" transform="rotate(-4 300 535)"/>
    <line x1="245" y1="555" x2="320" y2="555" stroke="#64748b" stroke-width="1.5" transform="rotate(-4 300 535)"/>

    <!-- Broadcast Anchor Desk Plaque -->
    <g transform="translate(180, 590)">
      <rect width="240" height="42" rx="10" fill="#0f172a" stroke="#eab308" stroke-width="2"/>
      <text x="120" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" fill="#fef08a" text-anchor="middle" letter-spacing="1.5">BEACON STICKMAN</text>
    </g>
  </g>
</svg>
