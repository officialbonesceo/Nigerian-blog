<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Studio wall -->
  <rect width="1920" height="1080" fill="#f1f5f9"/>
  <rect y="520" width="1920" height="560" fill="#e2e8f0"/>
  <!-- Soft horizon line -->
  <line x1="0" y1="520" x2="1920" y2="520" stroke="#94a3b8" stroke-width="3"/>

  <!-- Chair back -->
  <rect x="860" y="280" width="200" height="220" rx="18" fill="#cbd5e1" stroke="#0f172a" stroke-width="3"/>
  <rect x="900" y="240" width="120" height="40" rx="10" fill="#94a3b8" stroke="#0f172a" stroke-width="2.5"/>

  <!-- Spine + shoulders -->
  <line x1="960" y1="290" x2="960" y2="520" stroke="#0f172a" stroke-width="12" stroke-linecap="round"/>
  <line x1="900" y1="320" x2="1020" y2="320" stroke="#0f172a" stroke-width="11" stroke-linecap="round"/>

  <!-- Collar + red tie -->
  <polygon points="942,285 978,285 970,305 950,305" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="948,288 972,288 968,310 952,310" fill="#dc2626"/>
  <polygon points="952,310 968,310 976,430 960,470 944,430" fill="#ef4444" stroke="#991b1b" stroke-width="1.5"/>

  <!-- Arms rest on desk (natural) -->
  <path d="M900 320 Q860 420 820 510" fill="none" stroke="#0f172a" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="820" cy="512" r="10" fill="#0f172a"/>
  <path d="M1020 320 Q1060 420 1100 510" fill="none" stroke="#0f172a" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1100" cy="512" r="10" fill="#0f172a"/>

  <!-- Head -->
  <circle cx="960" cy="220" r="70" fill="#ffffff" stroke="#0f172a" stroke-width="10"/>
  <ellipse cx="935" cy="210" rx="8" ry="11" fill="#0f172a"/>
  <ellipse cx="985" cy="210" rx="8" ry="11" fill="#0f172a"/>
  <path d="M938 245 Q960 258 982 245" stroke="#0f172a" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- Headset -->
  <path d="M885 210 Q960 145 1035 210" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <rect x="875" y="198" width="14" height="32" rx="5" fill="#334155"/>
  <rect x="1031" y="198" width="14" height="32" rx="5" fill="#334155"/>
  <path d="M885 225 Q920 265 950 255" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <circle cx="952" cy="255" r="5" fill="#ef4444"/>

  <!-- DESK occupies lower ~48% of frame -->
  <path d="M0 540 Q960 500 1920 540 L1920 1080 L0 1080 Z" fill="#1e293b"/>
  <path d="M0 540 Q960 495 1920 540 L1920 575 Q960 530 0 575 Z" fill="#334155"/>
  <!-- Desk plate -->
  <rect x="780" y="720" width="360" height="70" rx="10" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
  <text x="960" y="765" text-anchor="middle" font-family="system-ui,sans-serif" font-size="28" font-weight="900" letter-spacing="3" fill="#f8fafc">9JA BEACON</text>

  <!-- Mic on desk -->
  <line x1="1120" y1="530" x2="1120" y2="480" stroke="#64748b" stroke-width="5"/>
  <rect x="1108" y="455" width="24" height="28" rx="6" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="1120" cy="462" r="4" fill="#ef4444"/>
</svg>
