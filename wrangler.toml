name = "naijapulse-news"
main = "./src/worker/cron-ingest.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "naijapulse-d1"
database_id = "naijapulse-d1-production"
migrations_dir = "./migrations"

# Cloudflare Cron Triggers for automated periodic RSS crawling
[triggers]
crons = ["*/30 * * * *"] # Run every 30 minutes to fetch and process RSS news

# Public Environment Variables
[vars]
ENVIRONMENT = "production"
SITE_URL = "https://naijapulse.pages.dev"
SITE_NAME = "NaijaPulse"

# Groq API and Admin Secrets should be added via:
# npx wrangler secret put GROQ_API_KEY
# npx wrangler secret put ADMIN_JWT_SECRET
