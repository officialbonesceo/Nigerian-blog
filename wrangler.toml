name = "9jabeacon-news"
pages_build_output_dir = "dist"
compatibility_date = "2026-08-29"
compatibility_flags = ["nodejs_compat"]

# Cloudflare D1 Database Binding for Cloudflare Pages
# Note: Cloudflare Pages fails with 'Error 8000022: Invalid database UUID' if database_id is not a valid 36-char UUID.
# Option 1 (Recommended for Pages): Bind in Cloudflare Dashboard:
#   Pages Project > Settings > Functions > D1 Database Bindings > Variable name: DB > Select your D1 database.
# Option 2: If using wrangler.toml, replace with your actual D1 UUID from `npx wrangler d1 create naijablog`:
# [[d1_databases]]
# binding = "DB"
# database_name = "naijablog"
# database_id = "YOUR_ACTUAL_D1_UUID_HERE"

[vars]
ENVIRONMENT = "production"
SITE_NAME = "9jaBeacon"
SITE_URL = "https://9jabeacon.pages.dev"

