name = "9jabeacon-news"
pages_build_output_dir = "dist"
compatibility_date = "2026-08-29"
compatibility_flags = ["nodejs_compat"]

# Cloudflare D1 Database Binding for Cloudflare Pages
[[d1_databases]]
binding = "DB"
database_name = "naijablog"
database_id = "naijablog"

[vars]
ENVIRONMENT = "production"
SITE_NAME = "9jaBeacon"
SITE_URL = "https://9jabeacon.pages.dev"

